name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      target_subproject:
        description: The subproject name of the specified Minecraft version to be released.
        type: string
        required: false
        default: ''
      target_release_tag:
        description: The tag of the release you want to append the artifact to
        type: string
        required: true


jobs:
  matrix_prep:
    uses: ./.github/workflows/matrix_prep.yml
    with:
      target_subproject: ${{ github.event.inputs.target_subproject }}

  build:
    uses: ./.github/workflows/build.yml
    with:
      target_subproject: ${{ github.event.inputs.target_subproject }}
      release: true

  release:
    needs:
      - matrix_prep
      - build
    runs-on: ubuntu-latest

    permissions:
      actions: read  # for actions/download-artifact
      contents: write  # for gh release upload

    strategy:
      matrix: ${{ fromJson(needs.matrix_prep.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: build-artifacts

      - name: Get github release information
        if: ${{ github.event_name == 'workflow_dispatch' }}
        id: get_release
        uses: cardinalby/git-get-release-action@v1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag: ${{ github.event.inputs.target_release_tag }}

      - name: Generate publish related information
        id: release_info
        run: |
          if [ $GITHUB_EVENT_NAME == 'release' ]
          then
              echo "tag_name=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          elif [ $GITHUB_EVENT_NAME == 'workflow_dispatch' ]
          then
              echo "tag_name=${{ github.event.inputs.target_release_tag }}" >> $GITHUB_OUTPUT
          else
              echo Unknown github event name $GITHUB_EVENT_NAME
              exit 1
          fi

      # GitHub sorts release assets by file name, not by upload order, so the
      # order in which the jars are uploaded here does not matter.
      - name: Attach the built jar to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_name="${{ steps.release_info.outputs.tag_name }}"
          jar_dir="build-artifacts/${{ matrix.subproject_dir }}/build/libs"
          shopt -s nullglob
          jars=("$jar_dir"/*.jar)
          if [ ${#jars[@]} -eq 0 ]
          then
              echo "No jar files found in $jar_dir" >&2
              exit 1
          fi
          for jar in "${jars[@]}"
          do
              case "$(basename "$jar")" in
                  *-dev.jar|*-sources.jar|*-shadow.jar)
                      echo "Skipping $jar"
                      continue
                      ;;
              esac
              echo "Uploading $jar to release $tag_name"
              gh release upload "$tag_name" "$jar" --clobber
          done

      - name: Read common properties
        id: properties_g
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: gradle.properties
          properties: 'mod_name mod_version'

      - name: Read version-specific properties
        id: properties_v
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: ${{ format('versions/{0}/gradle.properties', matrix.subproject_dir) }}
          properties: 'minecraft_version game_versions'

      - name: Fix game version
        id: game_versions
        run: |
          # Fixed \n in game_versions isn't parsed by christian-draeger/read-properties as a line separator
          echo 'value<<EOF' >> $GITHUB_OUTPUT
          echo -e "${{ steps.properties_v.outputs.game_versions }}" >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

